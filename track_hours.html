<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Track Hours</title>
    <link rel="stylesheet" href="track_hours.css">
</head>
<body>
    <main class="page-wrapper">
        <header>
            <h1>Track Trainer Hours</h1>
            <p class="subtitle">Monitor and manage trainer working hours for gym classes.</p>
        </header>

        <section class="form-grid">
            <div class="form-group">
                <label for="trainerSelect">Trainer Name</label>
                <select id="trainerSelect">
                    <option value="">Select trainer</option>
                    <option value="dahal bijaya">dahal bijaya</option>
                    <option value="khadka roshan">khadka roshan</option>
                    <option value="mike tison">mike tison</option>
                    <option value="rai sandesh">rai sandesh</option>
                </select>
            </div>
            <div class="form-group">
                <label for="classSelect">Class Type</label>
                <select id="classSelect">
                    <option value="">Select class</option>
                    <option value="Yoga">Yoga</option>
                    <option value="spinning">spinning</option>
                    <option value="boxing">boxing</option>
                    <option value="pilates">pilates</option>
                    <option value="HIIT">HIIT</option>
                    <option value="swimming">swimming</option>
                    <option value="others">others</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dateInput">Date</label>
                <input id="dateInput" type="date">
            </div>
            <div class="form-group">
                <label for="hoursInput">Hours Worked</label>
                <input id="hoursInput" type="number" min="0.5" step="0.5" placeholder="e.g. 2.5">
            </div>
            <div class="form-group full-width">
                <label for="notesInput">Notes</label>
                <textarea id="notesInput" placeholder="Optional notes about the session"></textarea>
            </div>
        </section>

        <div class="button-group">
            <button id="addHoursButton">Add Hours</button>
            <button id="clearButton" type="button">Clear Form</button>
        </div>

        <section class="hours-table">
            <h2>Hours Log</h2>
            <table>
                <thead>
                    <tr>
                        <th>Trainer</th>
                        <th>Class</th>
                        <th>Date</th>
                        <th>Hours</th>
                        <th>Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="hoursBody"></tbody>
            </table>
        </section>

        <div class="summary-section">
            <div class="summary-box">
                <span>Total Hours This Week:</span>
                <strong id="weeklyTotal">0</strong>
            </div>
            <div class="summary-box">
                <span>Total Hours This Month:</span>
                <strong id="monthlyTotal">0</strong>
            </div>
        </div>
    </main>

    <script src="track_hours.js"></script>
</body>
</html>
